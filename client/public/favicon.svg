<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Party Popper Cone -->
  <path d="M16 46 L24 22 C26 21 35 24 38 31 L20 48 C18 49 16 48 16 46 Z" fill="url(#coneGrad)"/>
  <path d="M19 41 L27 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Confetti Stripes on Cone -->
  <path d="M18 45 L36 33" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M21 39 L31 27" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Confetti ribbons & bursts -->
  <!-- Top sparkles -->
  <path d="M46 12 L48 18 L54 20 L48 22 L46 28 L44 22 L38 20 L44 18 Z" fill="url(#sparkleGrad)"/>
  <path d="M33 11 L34 14 L37 15 L34 16 L33 19 L32 16 L29 15 L32 14 Z" fill="#FDE047"/>
  <circle cx="49" cy="34" r="3" fill="#67E8F9"/>
  <circle cx="41" cy="27" r="2.5" fill="#F472B6"/>
  <circle cx="28" cy="18" r="2" fill="#FBBF24"/>
  <circle cx="48" cy="24" r="1.5" fill="#FFFFFF"/>

  <!-- Confetti streamers -->
  <path d="M36 22 Q42 16 45 22 T53 19" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M31 26 Q36 28 40 33" stroke="#F472B6" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M25 21 Q27 15 31 16" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
